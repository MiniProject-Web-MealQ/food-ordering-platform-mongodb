# The existing mealq_db_data volume is retained. Do not run compose down -v.
services:
  db:
    image: mongo:4.4.18
    restart: unless-stopped
    volumes:
      - db_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    image: mealq-api:${MEALQ_RELEASE:?Set MEALQ_RELEASE}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: /home/linapspi4/mealq-app/shared/backend.env
    environment:
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    image: mealq-web:${MEALQ_RELEASE:?Set MEALQ_RELEASE}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEALQ_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  db_data:
    external: true
    name: mealq_db_data
networks:
  default:
    name: mealq_default
    external: true
